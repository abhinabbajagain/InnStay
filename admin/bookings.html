<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnStay Admin - Bookings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin-style.css">
</head>
<body data-page="bookings">
    <div class="admin-layout">
        <div id="adminSidebar"></div>
        <div id="adminHeader"></div>

        <main class="admin-main">
            <div class="page-title">
                <h1>Bookings</h1>
                <p>Track and resolve booking activity in real time.</p>
            </div>

            <div class="search-bar">
                <input type="text" id="bookingSearch" placeholder="Search by booking ID or guest">
                <select id="statusFilter">
                    <option value="All">Status: All</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Pending">Pending</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <h2>Booking Requests</h2>
                    <div class="table-actions">
                        <button class="btn btn-secondary"><i class="fa-solid fa-file-export"></i> Export</button>
                        <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> Create Booking</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Guest</th>
                            <th>Hotel</th>
                            <th>Check-In Date</th>
                            <th>Check-Out Date</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../frontend/js/utils.js"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            ensureAuth();

            const tableBody = document.getElementById('bookingTableBody');
            const searchInput = document.getElementById('bookingSearch');
            const statusFilter = document.getElementById('statusFilter');

            let state = { bookings: [], hotels: [] };

            function loadData() {
                if (typeof AdminData !== 'undefined') {
                    state.bookings = deepClone(AdminData.bookings || []);
                    state.hotels = deepClone(AdminData.hotels || []);
                }
            }

            function getFilteredBookings() {
                const query = (searchInput?.value || '').toLowerCase().trim();
                const status = statusFilter?.value || 'All';

                return state.bookings.filter(booking => {
                    const matchesQuery = !query ||
                        booking.id.toString().includes(query) ||
                        booking.guestName.toLowerCase().includes(query);
                    const matchesStatus = status === 'All' || booking.status === status;
                    return matchesQuery && matchesStatus;
                });
            }

            function renderTable() {
                if (!tableBody) return;

                const bookings = getFilteredBookings();
                tableBody.innerHTML = bookings.map(booking => {
                    const hotel = state.hotels.find(h => h.id === booking.hotelId);
                    const total = booking.nights * (booking.pricePerNight || 150);
                    return `
                        <tr data-id="${booking.id}">
                            <td><strong>#BKG-${String(booking.id).padStart(4, '0')}</strong></td>
                            <td>${booking.guestName}</td>
                            <td>${hotel?.title || 'Unknown'}</td>
                            <td>${formatDate(booking.checkIn)}</td>
                            <td>${formatDate(booking.checkOut)}</td>
                            <td>${getStatusBadge(booking.status)}</td>
                            <td>${formatCurrency(total)}</td>
                            <td class="action-cells">
                                <button class="btn btn-sm btn-outline" data-action="view">View</button>
                                <button class="btn btn-sm btn-danger" data-action="cancel">Cancel</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            if (tableBody) {
                tableBody.addEventListener('click', (event) => {
                    const action = event.target.getAttribute('data-action');
                    const row = event.target.closest('tr');
                    const id = row?.getAttribute('data-id');

                    if (!action || !id) return;

                    if (action === 'view') {
                        const booking = state.bookings.find(b => b.id === Number(id));
                        if (booking) {
                            showNotification(`Viewing booking #BKG-${String(id).padStart(4, '0')} for ${booking.guestName}`, 'info');
                        }
                    }

                    if (action === 'cancel') {
                        if (confirmDialog('Cancel this booking?')) {
                            if (typeof AdminData !== 'undefined') {
                                const booking = AdminData.bookings.find(b => b.id === Number(id));
                                if (booking) {
                                    booking.status = 'Cancelled';
                                    showNotification('Booking cancelled', 'success');
                                    loadData();
                                    renderTable();
                                }
                            }
                        }
                    }
                });
            }

            if (searchInput) searchInput.addEventListener('input', renderTable);
            if (statusFilter) statusFilter.addEventListener('change', renderTable);

            loadData();
            renderTable();
        });
    </script>
</body>
</html>
