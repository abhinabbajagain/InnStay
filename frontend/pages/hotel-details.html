<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Luxury Hotel - InnStay Property Details">
    <title>Luxury Hotel - Property Details - InnStay</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/hotel-details.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-inner">
            <!-- Left: Brand Logo -->
            <div class="nav-left">
                <a class="navbar-brand" href="../index.html">
                    <i class="fas fa-home"></i> innstay
                </a>
            </div>

            <!-- Center: compact search pill (links to homepage) -->
            <div class="nav-center">
                <div class="nav-search-pill" id="navSearchPill" onclick="window.location.href='../index.html'">
                    <span class="nsp-seg">Anywhere</span>
                    <span class="nsp-sep"></span>
                    <span class="nsp-seg">Any week</span>
                    <span class="nsp-sep"></span>
                    <span class="nsp-seg nsp-last">Add guests</span>
                    <button class="nsp-btn" type="button"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <!-- Right: Auth & User Menu -->
            <div class="nav-right">
                <a href="become-host.html" class="become-host-link">Become a Host</a>
                <button class="btn-globe" type="button"><i class="fas fa-globe"></i></button>

                <!-- Guest nav (logged out) -->
                <div class="auth-buttons" data-auth="guestNav" style="display: flex !important; gap: 12px; align-items: center;">
                    <a href="login.html" class="btn-login" style="display: inline-flex !important; color: #222 !important;">Log in</a>
                    <a href="register.html" class="btn-signup" style="display: inline-flex !important; background: #FF5A5F !important; color: white !important;">Sign up</a>
                </div>

                <!-- User menu (logged in) -->
                <div class="user-nav" hidden data-auth="userNav">
                    <button class="btn-user-pill" id="menuBtn" type="button">
                        <i class="fas fa-bars"></i>
                        <i class="fas fa-user-circle"></i>
                    </button>
                    <div class="menu-dropdown" id="menuDropdown">
                        <span class="menu-item menu-item-bold menu-label">My Account</span>
                        <div class="menu-separator"></div>
                        <a href="../../admin/login.html" class="menu-item"><i class="fas fa-shield-alt"></i> Admin Panel</a>
                        <a href="#" class="menu-item" data-auth="logout"><i class="fas fa-sign-out-alt"></i> Log out</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="hotel-details-wrapper">
        <!-- Gallery -->
        <div class="gallery-section">
            <div class="main-image-container">
                <img id="mainImage" src="" alt="Property">
            </div>
            <div class="thumbnails-container" id="thumbnails"></div>
        </div>

        <!-- Content -->
        <div class="content-section">
            <!-- Header -->
            <div class="header-section">
                <div class="header-left">
                    <h1 id="propertyTitle"></h1>
                    <p id="propertyLocation"></p>
                    <div class="rating-display">
                        <span class="stars" id="ratingStars"></span>
                        <span class="reviews-count" id="ratingReviews"></span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="price-display">
                        <span id="propertyPrice"></span>
                        <span class="period">/night</span>
                    </div>
                </div>
            </div>

            <!-- Rooms Info -->
            <div class="rooms-info-section">
                <div class="room-item"><span id="bedrooms"></span></div>
                <div class="room-item"><span id="beds"></span></div>
                <div class="room-item"><span id="bathrooms"></span></div>
                <div class="room-item"><span id="guests"></span></div>
            </div>

            <!-- Description -->
            <div class="description-section">
                <h2>About this place</h2>
                <p id="propertyDescription"></p>
            </div>

            <!-- Amenities -->
            <div class="amenities-section">
                <h2>What this place offers</h2>
                <div class="amenities-grid" id="amenitiesList"></div>
            </div>

            <!-- Host -->
            <div class="host-section">
                <h2>Meet your host</h2>
                <div class="host-card">
                    <img id="hostPhoto" src="" alt="Host" class="host-photo">
                    <div class="host-info">
                        <h3 id="hostName"></h3>
                        <p id="hostBadge"></p>
                        <p id="hostDetails"></p>
                        <p id="hostResponse"></p>
                    </div>
                </div>
            </div>

            <!-- Ratings -->
            <div class="ratings-section">
                <h2>Ratings</h2>
                <div id="ratingsList"></div>
            </div>

            <!-- Reviews -->
            <div class="reviews-section">
                <h2>Reviews</h2>
                <div id="reviewsList"></div>
            </div>

            <!-- Booking -->
            <div class="booking-section">
                <h2>Booking details</h2>
                <div class="booking-info-item">
                    <strong>Cancellation:</strong>
                    <span id="cancellationPolicy"></span>
                </div>
                <div class="booking-info-item">
                    <strong>Check-in:</strong>
                    <span id="checkIn"></span>
                </div>
                <div class="booking-info-item">
                    <strong>Check-out:</strong>
                    <span id="checkOut"></span>
                </div>
            </div>

            <!-- Reserve Button -->
            <button class="reserve-button" id="reserveBtn">Reserve</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/utils.js"></script>
    <script src="../js/hotel-store.js"></script>
    <script src="../js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const propertyId = urlParams.get('id');
            
            if (propertyId) {
                displayPropertyDetails(propertyId);
            } else {
                window.location.href = '../index.html';
            }

            const reserveBtn = document.getElementById('reserveBtn');
            if (reserveBtn) {
                reserveBtn.addEventListener('click', () => {
                    alert('Booking feature coming soon!');
                });
            }
        });

        async function displayPropertyDetails(propertyId) {
            if (typeof HotelStore === 'undefined') {
                window.location.href = '../index.html';
                return;
            }
            const property = HotelStore.getHotelById(propertyId);
            if (!property) {
                window.location.href = '../index.html';
                return;
            }

            // Basic info
            document.getElementById('propertyTitle').textContent = property.title;
            document.getElementById('propertyLocation').textContent = property.location;
            document.getElementById('propertyPrice').textContent = `$${property.price}`;
            document.getElementById('propertyDescription').textContent = property.description;

            // Rating
            document.getElementById('ratingStars').textContent = '★'.repeat(Math.round(property.rating));
            document.getElementById('ratingReviews').textContent = `${property.rating} (${property.reviews} reviews)`;

            // Rooms
            document.getElementById('bedrooms').textContent = `${property.bedrooms} bedroom${property.bedrooms !== 1 ? 's' : ''}`;
            document.getElementById('beds').textContent = `${property.beds} bed${property.beds !== 1 ? 's' : ''}`;
            document.getElementById('bathrooms').textContent = `${property.bathrooms} bathroom${property.bathrooms !== 1 ? 's' : ''}`;
            document.getElementById('guests').textContent = `${property.guests} guests`;

            // Images
            const fallbackImage = typeof HotelStore !== 'undefined' ? HotelStore.placeholderImage : '';
            const safeImages = (property.images || []).map(img =>
                typeof HotelStore !== 'undefined' ? HotelStore.getSafeImageUrl(img) : img
            );
            const mainImage = document.getElementById('mainImage');
            mainImage.src = safeImages[0] || fallbackImage;
            mainImage.setAttribute('data-fallback', fallbackImage);

            const thumbnails = document.getElementById('thumbnails');
            thumbnails.innerHTML = safeImages.map((img, idx) => `
                <div class="thumbnail-item ${idx === 0 ? 'active' : ''}" data-image="${img}">
                    <img src="${img}" data-fallback="${fallbackImage}" alt="Photo ${idx + 1}">
                </div>
            `).join('');
            attachImageFallbacks();

            thumbnails.addEventListener('click', (event) => {
                const item = event.target.closest('.thumbnail-item');
                if (!item) {
                    return;
                }
                changeMainImage(item.dataset.image, item);
            });

            // Amenities
            const amenitiesList = document.getElementById('amenitiesList');
            const amenities = property.amenities || [];
            amenitiesList.innerHTML = amenities.map(amenity => `
                <div class="amenity-item">
                    <i class="fas fa-check"></i>
                    <span>${amenity}</span>
                </div>
            `).join('');

            // Host
            const host = property.host || {
                name: 'InnStay Host',
                years: 3,
                rating: property.rating || 4.5,
                reviews: property.reviews || 0,
                photo: fallbackImage,
                superhost: false,
                responseTime: '2 hours',
                responseRate: '95%'
            };
            document.getElementById('hostPhoto').src = host.photo;
            document.getElementById('hostName').textContent = host.name;
            document.getElementById('hostBadge').textContent = host.superhost ? '⭐ Superhost' : `Host for ${host.years} year${host.years !== 1 ? 's' : ''}`;
            document.getElementById('hostDetails').textContent = `${host.reviews} reviews • ${host.rating}★ rating`;
            document.getElementById('hostResponse').textContent = `Responds within ${host.responseTime} • ${host.responseRate} response rate`;

            // Ratings
            const ratingsList = document.getElementById('ratingsList');
            const breakdown = property.ratingBreakdown || {
                cleanliness: property.rating || 4.5,
                accuracy: property.rating || 4.5,
                checkin: property.rating || 4.5,
                communication: property.rating || 4.5,
                location: property.rating || 4.5,
                value: property.rating || 4.5
            };
            const maxRating = 5;
            ratingsList.innerHTML = Object.entries(breakdown).map(([key, value]) => `
                <div class="rating-item">
                    <span class="rating-name">${key.charAt(0).toUpperCase() + key.slice(1)}</span>
                    <div class="rating-bar">
                        <div class="rating-fill" style="width: ${(value / maxRating) * 100}%"></div>
                    </div>
                    <span class="rating-value">${value.toFixed(1)}</span>
                </div>
            `).join('');

            // Reviews
            const reviewsList = document.getElementById('reviewsList');
            const reviews = property.reviews_data || [];
            reviewsList.innerHTML = reviews.map(review => `
                <div class="review-card">
                    <div class="review-header">
                        <span class="reviewer-name">${review.reviewer}</span>
                        <span class="review-date">${review.date}</span>
                    </div>
                    <div class="review-rating">★ ${review.rating}</div>
                    <p class="review-text">${review.text}</p>
                </div>
            `).join('');

            // Booking info
            document.getElementById('cancellationPolicy').textContent = property.cancellation;
            document.getElementById('checkIn').textContent = property.checkIn;
            document.getElementById('checkOut').textContent = property.checkOut;
        }

        function changeMainImage(src, thumbnail) {
            const mainImage = document.getElementById('mainImage');
            mainImage.src = src;
            document.querySelectorAll('.thumbnail-item').forEach(item => item.classList.remove('active'));
            thumbnail.classList.add('active');
        }

        function attachImageFallbacks() {
            document.querySelectorAll('img[data-fallback]').forEach(img => {
                if (img.dataset.bound === 'true') {
                    return;
                }
                img.dataset.bound = 'true';
                img.addEventListener('error', () => {
                    img.src = img.dataset.fallback;
                });
            });
        }
    </script>
</body>
</html>
